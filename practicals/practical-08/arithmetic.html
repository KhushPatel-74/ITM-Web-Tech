<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calc">
        <h1>Arithmetic Operations</h1>
        <p class="sub">Enter two numbers and pick an operation</p>

        <div class="fields">
            <div>
                <label for="num1">First number</label>
                <input type="number" id="num1" placeholder="e.g. 12">
            </div>
            <div>
                <label for="num2">Second number</label>
                <input type="number" id="num2" placeholder="e.g. 4">
            </div>
        </div>

        <div class="ops">
            <button type="button" onclick="calculate('+')">Add +</button>
            <button type="button" onclick="calculate('-')">Subtract &minus;</button>
            <button type="button" onclick="calculate('*')">Multiply &times;</button>
            <button type="button" onclick="calculate('/')">Divide &divide;</button>
            <button type="button" onclick="calculate('%')">Modulus %</button>
            <button type="button" class="clear" onclick="clearAll()">Clear</button>
        </div>

        <div class="screen" id="screen">0</div>
    </div>

    <script>
        var symbols = { "+": "+", "-": "-", "*": "\u00D7", "/": "\u00F7", "%": "%" };

        function showResult(text, isError) {
            var screen = document.getElementById("screen");
            screen.innerHTML = text;
            screen.className = isError ? "screen error" : "screen";
        }

        function calculate(op) {
            var a = parseFloat(document.getElementById("num1").value);
            var b = parseFloat(document.getElementById("num2").value);

            if (isNaN(a) || isNaN(b)) {
                showResult("Please enter both numbers.", true);
                return;
            }

            var answer;
            if (op === "+") {
                answer = a + b;
            } else if (op === "-") {
                answer = a - b;
            } else if (op === "*") {
                answer = a * b;
            } else if (op === "/") {
                if (b === 0) {
                    showResult("Cannot divide by zero.", true);
                    return;
                }
                answer = a / b;
            } else if (op === "%") {
                if (b === 0) {
                    showResult("Cannot find modulus with zero.", true);
                    return;
                }
                answer = a % b;
            }

            answer = parseFloat(answer.toFixed(10));
            showResult(a + " " + symbols[op] + " " + b + " = " + answer, false);
        }

        function clearAll() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            showResult("0", false);
        }
    </script>
</body>
</html>
