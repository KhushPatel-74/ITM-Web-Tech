<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings</title>
    <link rel="stylesheet" href="soccer.css">
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>League Standings</h1>
            <h2>Last Season</h2>
            <table>
                <tr><th>Pos</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr>
                <tr class="leader"><td>1</td><td>Falcons</td><td>4</td><td>3</td><td>1</td><td>0</td><td>10</td></tr>
                <tr><td>2</td><td>Lions</td><td>4</td><td>3</td><td>0</td><td>1</td><td>9</td></tr>
                <tr><td>3</td><td>Rangers</td><td>4</td><td>2</td><td>1</td><td>1</td><td>7</td></tr>
                <tr><td>4</td><td>Strikers</td><td>4</td><td>1</td><td>1</td><td>2</td><td>4</td></tr>
                <tr><td>5</td><td>Hawks</td><td>4</td><td>1</td><td>0</td><td>3</td><td>3</td></tr>
                <tr><td>6</td><td>Titans</td><td>4</td><td>0</td><td>1</td><td>3</td><td>1</td></tr>
            </table>
            <p class="note">P = Played, W = Won, D = Drawn, L = Lost, Pts = Points (3 for a win, 1 for a draw).</p>
        </div>
    </div>
</body>
</html>
