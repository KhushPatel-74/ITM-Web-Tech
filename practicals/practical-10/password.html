<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show and Hide Password</title>
    <link rel="stylesheet" href="password.css">
</head>
<body>
    <div class="login">
        <div class="banner">
            <h1>Login</h1>
            <p>Show or hide your password while typing</p>
        </div>

        <form>
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="pw-row">
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                    <button type="button" id="toggleBtn" onclick="togglePassword()">Show</button>
                </div>
            </div>

            <p class="hint">Click Show to see what you typed, and Hide to cover it again.</p>
        </form>

    </div>

    <script>
        function togglePassword() {
            var box = document.getElementById("password");
            var btn = document.getElementById("toggleBtn");
            if (box.type === "password") {
                box.type = "text";
                btn.innerHTML = "Hide";
            } else {
                box.type = "password";
                btn.innerHTML = "Show";
            }
        }
    </script>
</body>
</html>
